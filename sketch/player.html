<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<meta name="description" content="__DESCRIPTION__">
<style>
__FONTFACES__
:root {
  --bg: #1c1a18; --fg: #f7f2e7; --accent: __ACCENT__; --paper: __PAPER__; --ink: __INK__;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --bg: #e9e6df; --fg: #2a2521; color-scheme: light; }
}
:root[data-theme="dark"] { --bg: #1c1a18; --fg: #f7f2e7; color-scheme: dark; }
:root[data-theme="light"] { --bg: #e9e6df; --fg: #2a2521; color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
body { display: flex; align-items: center; justify-content: center; overflow: hidden; padding-inline: 16px; padding-block: 16px; }
body.render { padding: 0; }
#stage { position: relative; width: min(100%, calc((100vh - 32px) * 16 / 9)); max-width: 100%; aspect-ratio: 16 / 9; }
body.render #stage { width: 100vw; }
canvas { width: 100%; height: 100%; display: block; background: var(--paper); border-radius: 10px; box-shadow: 0 18px 60px rgba(0,0,0,.35); cursor: pointer; }
body.render canvas { border-radius: 0; box-shadow: none; }
#overlay { position: absolute; inset: 0; display: flex; flex-direction: row; flex-wrap: wrap; align-items: flex-end; justify-content: center; gap: 2.2%; padding-bottom: 3%;
  background: rgba(255,255,255,.18); border-radius: 10px; transition: opacity .35s; cursor: pointer; }
#overlay.hidden { opacity: 0; pointer-events: none; }
#overlay:focus-visible { outline: 4px solid var(--accent); outline-offset: 4px; }
#playbtn { width: clamp(44px, 8.5%, 104px); aspect-ratio: 1; height: auto; border-radius: 50%; border: 4px solid var(--ink);
  background: var(--accent); display: grid; place-items: center; box-shadow: 4px 5px 0 var(--ink); transition: transform .15s; }
#overlay:hover #playbtn { transform: scale(1.06); }
#playbtn svg { width: 42%; height: 42%; margin-left: 8%; }
#hint { align-self: flex-end; margin-bottom: 2.4%; font-family: __HINT_FONT__; font-weight: 700; font-size: clamp(14px, 2.2vw, 30px); color: var(--ink);
  background: var(--paper); border: 3px solid var(--ink); border-radius: 999px; padding: .1em .9em .15em; box-shadow: 3px 4px 0 var(--ink); }
#bar { position: absolute; left: 14px; right: 14px; bottom: 12px; height: 6px; border-radius: 3px; background: rgba(42,37,33,.18); opacity: 0; transition: opacity .25s; cursor: pointer; }
#stage:hover #bar { opacity: 1; }
#fill { height: 100%; width: 0; border-radius: 3px; background: var(--accent); }
@media (max-width: 600px) { canvas, #overlay { border-radius: 0; } #bar { left: 8px; right: 8px; bottom: 8px; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1920" height="1080" aria-label="__TITLE__"></canvas>
  <div id="overlay" role="button" tabindex="0" aria-label="Play">
    <div id="playbtn"><svg viewBox="0 0 24 24"><path d="M5 3.5 L20 12 L5 20.5 Z" fill="#fff" stroke="__INK__" stroke-width="2" stroke-linejoin="round"/></svg></div>
    <div id="hint">__HINT__</div>
  </div>
  <div id="bar"><div id="fill"></div></div>
</div>
<audio id="audio" preload="auto" src="__AUDIO__"></audio>
<script>
// A syntax or top-level error in the film throws before the player below is listening; report the
// first one now, or a render sits out its 90 s stall timeout and then says nothing useful.
window.__early = function (e) {
  if (window.__earlyErr || !/[?&](render|export|encode|stills|automation|probe)=/.test(location.search)) return;
  // a cast member, a scene or a module names itself (sketch-render: //# sourceURL=cast/<name>.js,
  // scenes/<NN-slug>.js, sketch/<name>.js, or engine/<name>.js for a film's own copy of a module)
  const cast = /((?:cast|scenes|sketch|engine)\/[a-z0-9_-]+\.js)$/.exec(e.filename || '');
  window.__earlyErr = String(e.message) + ' @' + (cast ? cast[1] + ':' : '') + e.lineno;
  fetch('error', { method: 'POST', body: window.__earlyErr });
};
window.addEventListener('error', window.__early);
</script>
<script>
__ENGINE__
</script>
<script>
__PROPS__
</script>
__MODULES__
__CAST__
<script>
SK.VO = __VO__;
SK.VARS = __VARS__;
</script>
<script>
__FILM__
</script>
__SCENES__
<script>
(function () {
  // Modes (query string):
  //   (none)                interactive player
  //   ?render=1             no UI; window.__frame(t) draws one frame (manual capture)
  //   ?export=1&fps&from&to  draw every frame and POST its raw RGBA to /frame, then /done  (sketch-render.py)
  //   ?encode=<json>&fps&from&to  draw every frame into the browser's own H.264 encoder and POST
  //                         the stream to /h264 in batches, then /done  (sketch-render.py --encode browser)
  //   ?stills=1.5,9,23.8    POST a PNG per time to /still, then /done
  //   ?automation=1         POST SK.automation() JSON to /automation, then /done
  //   ?live=1[&ss=.5]       real time from the wall clock, no sound: a module's physics runs live
  //                         and the pointer is a hand (SK.pointers); N nudge, R reset, S 1/4 speed
  //   ?live=1&probe=10&drags=<json>&rec=960x540  the same, headless, for 10 s, the pointer driven
  //                         by `drags`: POST the recording to /live and the timings to /perf, /done
  const Q = new URLSearchParams(location.search);
  const RENDER = Q.has('render') || Q.has('export') || Q.has('encode') || Q.has('stills') || Q.has('automation');
  const audio = document.getElementById('audio');
  const overlay = document.getElementById('overlay');
  const fill = document.getElementById('fill');
  const bar = document.getElementById('bar');
  const cv = document.getElementById('c');
  const DUR = SK._film.duration, POSTER_T = __POSTER_T__;
  let ready = false, playing = false, clockBase = 0, clockAt = 0;
  // retried: one reset connection must not end a ten-minute render (the server ignores a repeat)
  const report = async (path, body) => {
    for (let k = 0; ; k++) {
      try { const r = await fetch(path, { method: 'POST', body }); if (r.ok) return r; throw new Error('HTTP ' + r.status); }
      catch (e) { if (k >= 6) throw e; await new Promise(res => setTimeout(res, 150 * 2 ** k)); }
    }
  };
  window.removeEventListener('error', window.__early);
  window.addEventListener('error', (e) => { if (RENDER || Q.has('probe')) report('error', String(e.message) + ' @' + e.lineno); });

  SK.init(cv);
  const faces = __FONT_LOADS__, IMAGES = __IMAGES__;
  const imgs = Object.entries(IMAGES).map(([k, src]) => new Promise(r => { const im = new Image(); im.onload = () => { SK.IMG[k] = im; r(); }; im.onerror = () => r(); im.src = src; }));
  Promise.all([...faces.map(f => document.fonts.load(f)), ...imgs]).then(() => document.fonts.ready).then(async () => {
    SK.makeTextures();
    ready = true;
    window.__frame = (t) => { SK.render(t); return true; };
    if (RENDER) {
      document.body.classList.add('render'); overlay.remove(); bar.remove(); window.__ready = true;
      const png = () => new Promise(r => cv.toBlob(r, 'image/png'));
      try {
        if (Q.has('export')) {
          const fps = +Q.get('fps') || 60, from = +(Q.get('from') || 0), to = +(Q.get('to') || DUR);
          const n = Math.round((to - from) * fps);
          SK.FPS = fps; // a clock in the film may divide it (collage.js SK.stepFps)
          // raw RGBA, not PNG: toBlob() fills Chromium's blob store faster than GC frees it
          // ("Failed to fetch" after ~100 frames), and skipping the PNG round trip is faster too
          const cx2 = cv.getContext('2d');
          for (let i = 0; i < n; i++) { SK.render(from + i / fps); await report('frame?i=' + i, cx2.getImageData(0, 0, cv.width, cv.height).data); }
        }
        if (Q.has('encode')) {
          // the canvas goes to the encoder where it already is: no 8 MB readback and POST per
          // frame, which is what capped ?export (_encode.webcodecs() has the measurements)
          const fps = +Q.get('fps') || 60, from = +(Q.get('from') || 0), to = +(Q.get('to') || DUR);
          const n = Math.round((to - from) * fps);
          SK.FPS = fps; // a clock in the film may divide it (collage.js SK.stepFps)
          const E = JSON.parse(Q.get('encode'));
          const sup = await VideoEncoder.isConfigSupported(E.config);
          // sketch-render falls back to ?export on this exact prefix
          if (!sup.supported) throw new Error('no-encoder: this browser will not encode ' + JSON.stringify(E.config));
          let failed = null, out = [], coded = 0;
          const enc = new VideoEncoder({
            output: (c) => { const b = new Uint8Array(c.byteLength); c.copyTo(b); out.push(b); coded++; },
            error: (e) => { failed = e; },
          });
          enc.configure(E.config);
          // one POST per second of film: progress for the stall watchdog, and bounded memory
          const send = async () => { if (out.length) { const body = new Blob(out); out = []; await report('h264?n=' + coded, body); } };
          const us = 1e6 / fps;
          for (let i = 0; i < n; i++) {
            if (failed) throw failed;
            SK.render(from + i / fps);
            const f = new VideoFrame(cv, { timestamp: Math.round(i * us), duration: Math.round(us) });
            enc.encode(f, E.config.bitrateMode === 'quantizer' ? { keyFrame: i % E.gop === 0, avc: { quantizer: E.quantizer } } : { keyFrame: i % E.gop === 0 });
            f.close();
            while (enc.encodeQueueSize > 4 && !failed) await new Promise(r => setTimeout(r, 1));
            if (out.length >= fps) await send();
          }
          await enc.flush();
          if (failed) throw failed;
          await send();
          enc.close();
        }
        if (Q.has('stills')) for (const s of Q.get('stills').split(',')) { SK.render(+s); await report('still?t=' + s, await png()); }
        // what a script in the page learned while the stills were drawn (sketch/thumb.js: the film's own styles)
        if (Q.has('stills') && typeof SK.REPORT === 'function') await report('report', JSON.stringify(SK.REPORT()));
        if (Q.has('automation')) await report('automation', JSON.stringify(SK.automation()));
      } catch (e) { await report('error', String(e && e.stack || e)); }
      if (!Q.has('render')) await report('done', '');
      return;
    }
    if (Q.has('live')) return live();
    SK.render(POSTER_T);
    requestAnimationFrame(loop);
  });

  /* ---- live: the film on the wall clock, a module's physics stepping as it goes */
  function live() {
    const probe = +Q.get('probe') || 0;
    overlay.remove(); bar.remove();
    if (probe) { document.body.classList.add('render'); }
    let speed = 1, simT = 0, last = null, frames = 0;
    // the film's type holds where its fade-out would begin; the physics clock runs on
    const hold = Math.max(0, DUR - (SK._film.fadeOut ?? 0.45) - 0.05);
    SK.LIVE = { now: () => simT, ss: +Q.get('ss') || 0 };
    const hands = () => SK.pointers || [];
    const film = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * SK.W, (e.clientY - r.top) / r.height * SK.H]; };
    cv.style.touchAction = 'none'; cv.style.cursor = 'grab';
    cv.addEventListener('pointerdown', (e) => {
      const [x, y] = film(e);
      if (hands().map((h) => h('down', x, y)).some(Boolean)) { cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing'; e.preventDefault(); }
    });
    cv.addEventListener('pointermove', (e) => { const [x, y] = film(e); hands().forEach((h) => h('move', x, y)); });
    const up = (e) => { hands().forEach((h) => h('up')); cv.style.cursor = 'grab'; try { cv.releasePointerCapture(e.pointerId); } catch (_) { /* not captured */ } };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    const ctl = () => SK.liveControls || {};
    const reset = () => { simT = 0; ctl().reset && ctl().reset(); };
    const slow = () => { speed = speed === 1 ? 0.25 : 1; };
    document.addEventListener('keydown', (e) => {
      if (e.key === 'n' || e.key === 'N') ctl().nudge && ctl().nudge();
      if (e.key === 'r' || e.key === 'R') reset();
      if (e.key === 's' || e.key === 'S') slow();
    });
    let fpsEl = null;
    if (!probe) {
      const bar2 = document.createElement('div');
      bar2.style.cssText = 'position:absolute;right:1.4%;bottom:2%;display:flex;gap:8px;align-items:center;font:600 13px system-ui;color:var(--ink)';
      for (const [label, fn] of [['Give it a nudge', () => ctl().nudge && ctl().nudge()], ['Reset', reset], ['\u00bc speed', slow]]) {
        const b = document.createElement('button'); b.textContent = label; b.onclick = fn;
        b.style.cssText = 'font:inherit;padding:6px 12px;border:1px solid rgba(0,0,0,.25);border-radius:4px;background:rgba(255,255,255,.85);cursor:pointer';
        bar2.appendChild(b);
      }
      fpsEl = document.createElement('span'); fpsEl.style.cssText = 'min-width:6em;text-align:right;opacity:.6';
      bar2.appendChild(fpsEl);
      document.getElementById('stage').appendChild(bar2);
    }
    // ---- the probe: the pointer scripted, the picture recorded, every frame timed
    const drags = probe ? JSON.parse(Q.get('drags') || '[]') : [];
    let rec = null, recCv = null, recCtx = null, chunks = [], mime = '';
    const times = [], perf = [];
    if (probe && Q.get('rec') !== 'none') {
      const [rw, rh] = (Q.get('rec') || '960x540').split('x').map(Number);
      recCv = document.createElement('canvas'); recCv.width = rw; recCv.height = rh; recCtx = recCv.getContext('2d');
      mime = ['video/mp4;codecs=avc1.640028', 'video/mp4;codecs=avc1.42E01F', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find((m) => MediaRecorder.isTypeSupported(m)) || '';
      rec = new MediaRecorder(recCv.captureStream(60), { mimeType: mime, videoBitsPerSecond: 12e6 });
      rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    }
    const pointerAt = (t) => { // [kind, x, y] for this frame, from drags [[t, handle, dx, dy], ...]
      for (const d of drags) {
        const [t0, name, dx, dy] = d, u = t - t0;
        if (u < 0 || u > 1.1) continue;
        if (!d.from) d.from = ctl().handle ? ctl().handle(name) : [SK.W / 2, SK.H / 2];
        const k = Math.min(1, u / 0.8), e = k * k * (3 - 2 * k), x = d.from[0] + dx * e, y = d.from[1] + dy * e;
        if (!d.down) { d.down = true; hands().forEach((h) => h('down', x, y)); return; }
        if (u < 1.05) { hands().forEach((h) => h('move', x, y)); return; }
        if (!d.up) { d.up = true; hands().forEach((h) => h('up')); }
      }
    };
    const J = SK.jelly && SK.jelly.perf;
    let warm = 4; // frames drawn at t = 0 before the clock starts: see below
    function frame(ts) {
      if (warm > 0) { if (warm-- === 4 && rec) rec.start(1000); SK.render(0); requestAnimationFrame(frame); return; }
      if (last === null) last = ts;
      const dt = Math.min(0.1, (ts - last) / 1000);
      last = ts;
      simT += dt * speed;
      if (probe) pointerAt(simT);
      const a = J ? { ...J } : null;
      SK.render(Math.min(simT, hold));
      if (recCtx) recCtx.drawImage(cv, 0, 0, recCv.width, recCv.height);
      frames++;
      times.push(ts);
      if (J) perf.push([J.physMs - a.physMs, J.drawMs - a.drawMs, J.simFrames - a.simFrames]);
      if (fpsEl && frames % 15 === 0 && times.length > 30) {
        const n = times.length, f = 30 / ((times[n - 1] - times[n - 31]) / 1000);
        fpsEl.textContent = f.toFixed(0) + ' fps' + (speed < 1 ? ' \u00b7 \u00bc' : '');
      }
      if (probe && times.length > 1 && (ts - times[0]) / 1000 >= probe) return finish();
      requestAnimationFrame(frame);
    }
    async function finish() {
      try {
        if (rec) {
          const stopped = new Promise((r) => { rec.onstop = r; });
          rec.stop(); await stopped;
          await report('live?type=' + encodeURIComponent(mime), new Blob(chunks, { type: mime }));
        }
        const gl = document.createElement('canvas').getContext('webgl2'), dbg = gl && gl.getExtension('WEBGL_debug_renderer_info');
        await report('perf', JSON.stringify({
          wall: (times[times.length - 1] - times[0]) / 1000, frames: times.length,
          gaps: times.slice(1).map((t, i) => +(t - times[i]).toFixed(2)), perf,
          simTime: ctl().simTime ? ctl().simTime() : null, glSize: ctl().size ? ctl().size() : null,
          simFps: ctl().fps ? ctl().fps() : 60,
          mime, gpu: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : null,
        }));
      } catch (e) { await report('error', String(e && e.stack || e)); }
      await report('done', '');
    }
    // frames before the clock starts: shaders compile on the first draw and the recorder's
    // encoder on its first frame (2.2 s and 2.4 s measured on the laptop), and a clock already
    // running would lose that time from the physics
    requestAnimationFrame(frame);
  }

  function now() {
    const a = audio.currentTime;
    if (a !== clockBase) { clockBase = a; clockAt = performance.now(); }
    return playing && !audio.paused ? clockBase + (performance.now() - clockAt) / 1000 : a;
  }
  function loop() {
    if (ready && playing) { const t = Math.min(DUR, now()); SK.render(t); fill.style.width = (t / DUR * 100) + '%'; }
    requestAnimationFrame(loop);
  }
  function start() {
    if (!ready) return;
    if (audio.ended || audio.currentTime >= DUR - .05) audio.currentTime = 0;
    audio.play().then(() => { playing = true; clockBase = audio.currentTime; clockAt = performance.now(); overlay.classList.add('hidden'); }).catch(() => {});
  }
  function pause() { audio.pause(); playing = false; overlay.classList.remove('hidden'); document.getElementById('hint').textContent = 'paused · click to continue'; }
  overlay.addEventListener('click', start);
  overlay.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); start(); } });
  cv.addEventListener('click', () => playing ? pause() : start());
  document.addEventListener('keydown', (e) => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); playing ? pause() : start(); } });
  audio.addEventListener('ended', () => { playing = false; SK.render(POSTER_T); fill.style.width = '100%'; overlay.classList.remove('hidden'); document.getElementById('hint').textContent = 'watch again'; });
  bar.addEventListener('click', (e) => {
    const r = bar.getBoundingClientRect(); const t = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * DUR;
    audio.currentTime = t; clockBase = t; clockAt = performance.now(); SK.render(t); fill.style.width = (t / DUR * 100) + '%';
  });
})();
</script>
</body>
</html>
