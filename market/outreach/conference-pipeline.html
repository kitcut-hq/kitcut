<title>KitCut Conference Pipeline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* layout: one column. A stage strip that is also the filter, then a ledger of events; each event opens in place. */
:root{
  --paper:#f2f4f8; --card:#ffffff; --ink:#131c2b; --muted:#586479; --line:#d7dde8;
  --accent:#1f4fd8; --good:#16794a; --warn:#9a5600; --bad:#b3261e;
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0e131c; --card:#171e2a; --ink:#e7ecf5; --muted:#98a4b8; --line:#2a3445;
    --accent:#8fb0ff; --good:#5fd39a; --warn:#f0b35a; --bad:#ff8a80;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0e131c; --card:#171e2a; --ink:#e7ecf5; --muted:#98a4b8; --line:#2a3445;
  --accent:#8fb0ff; --good:#5fd39a; --warn:#f0b35a; --bad:#ff8a80;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:28px 64px;display:flex;flex-direction:column;gap:20px}
header h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted);max-width:65ch}
.tally{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:10px;font-variant-numeric:tabular-nums}
.tally b{color:var(--ink);font-weight:500}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 11px;border-radius:999px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.chip .n{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:var(--paper);opacity:.75}
.search{flex:1 1 180px;min-width:0;font:inherit;font-size:14px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
:is(button,input,select,textarea,a):focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.ledger{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.lead + .lead{border-top:1px solid var(--line)}
.row{width:100%;font:inherit;color:inherit;background:none;border:0;text-align:left;cursor:pointer;padding:13px 16px;display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.3fr) auto minmax(0,1.5fr);gap:14px;align-items:center}
.row:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.ev b{display:block;font-weight:600;overflow-wrap:anywhere}
.ev small,.next{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.when{font-family:var(--mono);font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent;justify-self:start}
.pill.n{color:var(--muted);border-color:var(--line)}
.pill.i{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.pill.w{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.s{color:var(--card);background:var(--accent)}
.pill.g{color:var(--good);background:color-mix(in srgb,var(--good) 15%,transparent)}
.pill.b{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.flag{font-size:12px;font-weight:600;margin-left:8px}
.flag.approved{color:var(--good)} .flag.hold{color:var(--warn)} .flag.skip{color:var(--bad)}

.body{padding:4px 16px 20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:22px 28px;border-top:1px dashed var(--line)}
.body section{display:flex;flex-direction:column;gap:6px;min-width:0}
.col{display:flex;flex-direction:column;gap:18px;min-width:0;padding-top:14px}
h3{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.body p{margin:0;overflow-wrap:anywhere}
.mono{font-family:var(--mono);font-size:13px}
.quiet{color:var(--muted)}
a{color:var(--accent)}
.mail{white-space:pre-wrap;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--paper);font-size:14px;overflow-wrap:anywhere}
.subj{font-weight:600}
ul.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
ul.log time{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:8px}
ul.soc{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;font-size:14px}
ul.soc li{display:contents}
ul.soc .net{color:var(--muted);font-size:13px}
ul.soc a{font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}
.marks{display:inline-flex;gap:5px;margin-left:8px;vertical-align:1px}
.mark{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-size:13.5px;font-weight:500;padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card)}
select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
textarea{width:100%;min-height:70px;resize:vertical}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:13.5px}
@media (max-width:720px){
  .row{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
  .row .when{grid-column:1} .row .next{grid-column:1 / -1}
  .row .pill{grid-row:1;grid-column:2}
  .body{grid-template-columns:minmax(0,1fr)}
}
</style>

<div class="wrap">
  <header>
    <h1>Conference pipeline</h1>
    <p>Every conference we are approaching with a film made for it. Claude keeps this page current. Open an event to watch its film, read the email, and say Approve, Hold or Skip; Claude reads your call and your note before each step.</p>
    <div class="tally" id="tally"></div>
  </header>
  <div class="bar" id="bar"></div>
  <div class="ledger" id="ledger"><div class="empty" id="empty">Loading the pipeline…</div></div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
const STAGES=[["review","Ready for your look","w"],["replied","Replied","g"],["talking","In conversation","g"],["sent","Email sent","s"],["filming","Film being made","i"],["research","Researching","i"],["new","Not started","n"],["blocked","No inbox yet","n"],["won","Won","g"],["lost","Closed","b"]];
const LABEL=Object.fromEntries(STAGES.map(s=>[s[0],s[1]])), TONE=Object.fromEntries(STAGES.map(s=>[s[0],s[2]])), RANK=Object.fromEntries(STAGES.map((s,i)=>[s[0],i]));
const CALLS=[["approved","Approve to send"],["hold","Hold"],["skip","Skip this one"]];
const state={leads:[],filter:"all",q:"",open:new Set(),drafts:new Map(),loaded:false};
let db=null;
const $=id=>document.getElementById(id);
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const k in attrs||{}){const v=attrs[k];if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v);}for(const c of kids.flat(3)){if(c==null||c===false||c==="")continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}return e;}
const str=v=>typeof v==="string"?v:"";
const day=v=>{const d=new Date(str(v));return isNaN(d)?"":d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});};
const safeUrl=v=>/^https:\/\/(kitcut\.ai|youtu\.be|www\.youtube\.com)\//.test(str(v))?v:null;
const NETS=[["x","X",/^https:\/\/x\.com\//],["threads","Threads",/^https:\/\/www\.threads\.com\//],["linkedin","LinkedIn",/^https:\/\/www\.linkedin\.com\//],["instagram","Instagram",/^https:\/\/www\.instagram\.com\//],["youtube","YouTube",/^https:\/\/www\.youtube\.com\//],["facebook","Facebook",/^https:\/\/www\.facebook\.com\//]];
const socialsOf=l=>{const s=l.socials&&typeof l.socials==="object"?l.socials:{};return NETS.filter(n=>n[2].test(str(s[n[0]]))).map(n=>({key:n[0],label:n[1],url:s[n[0]],name:(n[0]==="x"||n[0]==="instagram"?"@":"")+decodeURIComponent(s[n[0]].replace(n[2],"")).replace(/\/$/,"")}));};
let toastT;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400);}

async function save(id,patch,msg){
  if(!db){toast("Sign in on claude.ai to change this.");return;}
  try{await db.doc("leads/"+id).update({...patch,updated_at:new Date().toISOString()});toast(msg||"Saved");}
  catch(e){toast(e&&e.code==="invalid_argument"?"You can read this page but not change it.":"Could not save. Try again.");}
}

function stageOf(l){return LABEL[l.stage]?l.stage:"new";}
function visible(){
  const q=state.q.trim().toLowerCase();
  return state.leads.filter(l=>(state.filter==="all"||stageOf(l)===state.filter)&&(!q||[l.event,l.org,l.audience,l.when,(l.emails||[]).join(" "),socialsOf(l).map(s=>s.name).join(" ")].join(" ").toLowerCase().includes(q)))
    .sort((a,b)=>RANK[stageOf(a)]-RANK[stageOf(b)]||str(a.date_sort||"9").localeCompare(str(b.date_sort||"9"))||str(a.event).localeCompare(str(b.event)));
}

function renderBar(){
  const counts={};for(const l of state.leads)counts[stageOf(l)]=(counts[stageOf(l)]||0)+1;
  const chip=(key,label,n)=>h("button",{class:"chip",type:"button","aria-pressed":String(state.filter===key),onclick:()=>{state.filter=key;render();}},label,h("span",{class:"n"},n));
  const bar=$("bar");const hadFocus=document.activeElement&&document.activeElement.id==="q";
  bar.replaceChildren(chip("all","All",state.leads.length),...STAGES.filter(s=>counts[s[0]]).map(s=>chip(s[0],s[1],counts[s[0]])),
    h("input",{class:"search",id:"q",type:"search",placeholder:"Find an event, organiser or address","aria-label":"Find an event",value:state.q,oninput:e=>{state.q=e.target.value;renderList();}}));
  if(hadFocus){const q=$("q");q.focus();q.setSelectionRange(q.value.length,q.value.length);}
  const sent=state.leads.filter(l=>l.sent_at).length,rep=(counts.replied||0)+(counts.talking||0)+(counts.won||0),films=state.leads.filter(l=>l.film_url).length;
  $("tally").replaceChildren(h("b",null,state.leads.length)," events · ",h("b",null,films)," films made · ",h("b",null,sent)," emails sent · ",h("b",null,rep)," replies");
}

function leadBody(l){
  const id=l.id,film=safeUrl(l.film_url),emails=Array.isArray(l.emails)?l.emails:[],log=Array.isArray(l.log)?l.log:[];
  const note=state.drafts.has(id)?state.drafts.get(id):str(l.owner_note);
  return h("div",{class:"body"},
    h("div",{class:"col"},
      h("section",null,h("h3",null,"Who to write to"),
        l.contact_name&&h("p",null,l.contact_name,l.contact_role&&h("span",{class:"quiet"}," · "+l.contact_role)),
        emails.length?emails.map(e=>h("p",{class:"mono"},e)):h("p",{class:"quiet"},"No public address."),
        l.access_note&&h("p",{class:"quiet"},l.access_note)),
      h("section",null,h("h3",null,"Where they post"),
        socialsOf(l).length?h("ul",{class:"soc"},socialsOf(l).map(s=>h("li",null,h("span",{class:"net"},s.label),h("a",{href:s.url,target:"_blank",rel:"noopener"},s.name)))):h("p",{class:"quiet"},"Not looked up yet."),
        l.socials_note&&h("p",{class:"quiet"},str(l.socials_note))),
      h("section",null,h("h3",null,"Film"),
        film?h("p",null,h("a",{href:film,target:"_blank",rel:"noopener"},"Watch the film")):h("p",{class:"quiet"},str(l.film_state)||"Not made yet."),
        (l.template||l.film_minutes)&&h("p",{class:"quiet"},[l.template,l.film_minutes&&"made in "+l.film_minutes+" min"].filter(Boolean).join(" · ")),
        l.film_note&&h("p",null,l.film_note)),
      h("section",null,h("h3",null,"What happened"),
        log.length?h("ul",{class:"log"},log.slice().reverse().map(x=>h("li",null,h("time",null,day(x&&x.at)),str(x&&x.text)))):h("p",{class:"quiet"},"Nothing yet."))),
    h("div",{class:"col"},
      h("section",null,h("h3",null,l.sent_at?"Email sent "+day(l.sent_at):"Email draft"),
        l.email_body?[l.sent_to&&h("p",{class:"mono quiet"},"To "+l.sent_to),h("p",{class:"subj"},str(l.email_subject)),h("div",{class:"mail"},str(l.email_body))]:h("p",{class:"quiet"},"Not written yet.")),
      h("section",null,h("h3",null,"Your call"),
        h("div",{class:"acts"},CALLS.map(c=>h("button",{type:"button",class:"btn"+(l.decision===c[0]?" on":""),"aria-pressed":String(l.decision===c[0]),onclick:()=>save(id,{decision:l.decision===c[0]?"":c[0],decision_at:new Date().toISOString()},l.decision===c[0]?"Cleared":c[1]+": noted")},c[1])),
          h("select",{id:"stage-"+id,"aria-label":"Stage",onchange:e=>save(id,{stage:e.target.value},"Stage changed")},STAGES.map(s=>h("option",{value:s[0],selected:stageOf(l)===s[0]},s[1]))))),
      h("section",null,h("h3",null,"Note for Claude"),
        h("textarea",{id:"note-"+id,placeholder:"Change the offer, name the right person, ask for a different film…",oninput:e=>state.drafts.set(id,e.target.value)},note),
        h("div",{class:"acts"},h("button",{type:"button",class:"btn primary",onclick:async()=>{const v=state.drafts.has(id)?state.drafts.get(id):str(l.owner_note);await save(id,{owner_note:v,owner_note_at:new Date().toISOString()},"Note saved");state.drafts.delete(id);}},"Save note"),
          l.owner_note_at&&h("span",{class:"quiet"},"Saved "+day(l.owner_note_at))))));
}

function renderList(){
  const ledger=$("ledger"),act=document.activeElement,focusId=act&&act.id,sel=act&&act.tagName==="TEXTAREA"?[act.selectionStart,act.selectionEnd]:null;
  const rows=visible();
  if(!rows.length){ledger.replaceChildren(h("div",{class:"empty"},!state.loaded?"Loading the pipeline…":state.leads.length?"Nothing matches that filter.":"No events yet. Claude adds them from the conference list; each one then gets a film and an email here."));return;}
  ledger.replaceChildren(...rows.map(l=>{
    const open=state.open.has(l.id),st=stageOf(l);
    return h("article",{class:"lead"},
      h("button",{class:"row",type:"button",id:"row-"+l.id,"aria-expanded":String(open),onclick:()=>{open?state.open.delete(l.id):state.open.add(l.id);renderList();}},
        h("span",{class:"ev"},h("b",null,str(l.event),h("span",{class:"marks"},socialsOf(l).filter(s=>s.key==="x"||s.key==="threads").map(s=>h("span",{class:"mark",title:s.label+" "+s.name},s.key==="x"?"X":"Th")))),h("small",null,[l.org,l.audience].filter(Boolean).join(" · "))),
        h("span",{class:"when"},str(l.when)),
        h("span",null,h("span",{class:"pill "+TONE[st]},LABEL[st]),l.decision&&h("span",{class:"flag "+l.decision},l.decision==="approved"?"Approved":l.decision==="hold"?"On hold":"Skipped")),
        h("span",{class:"next"},str(l.next_step))),
      open&&leadBody(l));
  }));
  if(focusId){const el=document.getElementById(focusId);if(el){el.focus();if(sel&&el.setSelectionRange)el.setSelectionRange(sel[0],sel[1]);}}
}
function render(){renderBar();renderList();}

(async()=>{
  db=window.claude&&window.claude.use?await window.claude.use("db"):null;
  if(!db){state.loaded=true;$("ledger").replaceChildren(h("div",{class:"empty"},"Open this page signed in on claude.ai to load the pipeline."));return;}
  db.collection("leads").onSnapshot(snap=>{state.loaded=true;state.leads=snap.docs.map(d=>({...d.data(),id:d.id}));render();},
    ()=>{$("ledger").replaceChildren(h("div",{class:"empty"},"The pipeline could not be loaded. Reload the page."));});
})();
</script>
