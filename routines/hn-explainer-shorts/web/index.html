<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Video ideas</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1d1c1a; --muted: #6b6860; --line: #e4e1d8;
    --accent: #c8102e; --accent-ink: #ffffff; --chip: #efede6;
    --breaking: #c8102e; --hype: #b8590b; --evergreen: #2f5d8a;
    --ok: #1f6f43; --warn: #8a6100; --bad: #a3122a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --card: #1e1d1b; --ink: #ecebe6; --muted: #a29f95; --line: #34322e;
      --accent: #ff4d5e; --accent-ink: #141413; --chip: #2a2926;
      --breaking: #ff4d5e; --hype: #f0a050; --evergreen: #7fb0e0;
      --ok: #5ec48c; --warn: #e5b94e; --bad: #ff6b7d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar { max-width: 760px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 12px; align-items: center; }
  .bar h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .bar .sub { color: var(--muted); font-size: 13px; }
  .bar .grow { flex: 1; min-width: 0; }
  main { max-width: 760px; margin: 0 auto; padding: 8px 16px 64px; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); padding: 8px 12px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.primary.confirm { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  button:disabled { opacity: .55; cursor: default; }
  .run { margin-top: 22px; }
  .run > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 4px; font-weight: 600; }
  .run > p.summary { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 10px 0; }
  .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .kind { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 6px; color: #fff; }
  .kind.breaking { background: var(--breaking); } .kind.hype { background: var(--hype); } .kind.evergreen { background: var(--evergreen); }
  h3 { margin: 0; font-size: 18px; line-height: 1.3; }
  .stakes { margin: 8px 0 6px; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; }
  .fact { background: var(--chip); border-radius: 8px; padding: 3px 8px; font-size: 13px; color: var(--muted); }
  .fact b { color: var(--ink); font-weight: 600; }
  .links { font-size: 13px; margin-top: 6px; color: var(--muted); overflow-wrap: anywhere; }
  .links a { color: inherit; }
  .angles { margin-top: 12px; display: grid; gap: 8px; }
  .angle { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; }
  .angle .fmt { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
  .angle .t { font-weight: 650; font-size: 16px; }
  .angle .why { color: var(--muted); font-size: 14px; }
  .angle .row { display: flex; justify-content: flex-end; }
  details.own { margin-top: 8px; }
  details.own summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  textarea { width: 100%; min-height: 70px; font: inherit; padding: 8px 10px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); margin: 8px 0; }
  .opts { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .opts label { font-size: 14px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .pick { margin-top: 10px; border-left: 3px solid var(--line); padding: 4px 0 4px 10px; font-size: 14px; }
  .pick .state { font-weight: 700; text-transform: uppercase; font-size: 12px; letter-spacing: .05em; }
  .state.published, .state.done { color: var(--ok); } .state.dropped, .state.failed { color: var(--bad); }
  .state.picked, .state.started, .state.researching, .state.making { color: var(--warn); }
  .pick a { color: var(--ink); }
  .empty, .err { color: var(--muted); padding: 40px 0; text-align: center; }
  .err { color: var(--bad); }
  form.key { max-width: 420px; margin: 60px auto; display: grid; gap: 10px; }
  form.key input { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
    padding: 10px 14px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); display: none; }
</style>
</head>
<body>
<header><div class="bar">
  <div class="grow"><h1>Video ideas</h1><div class="sub" id="sub">From Hacker News, every 12 hours. Pick an angle to make it.</div></div>
  <button id="refresh" title="Refresh">↻</button>
</div></header>
<main id="main"><div class="empty">Loading…</div></main>
<div class="toast" id="toast"></div>
<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const main = $("#main");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                  set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

  // The key arrives once in the link (?k=...), is kept on this device, and is dropped from the address bar.
  const params = new URLSearchParams(location.search);
  if (params.get("k")) { store.set("ideas_key", params.get("k")); history.replaceState(null, "", location.pathname + location.hash); }
  let key = store.get("ideas_key") || "";

  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.style.display = "block";
    clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = "none"), 4000);
  }

  function when(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    return d.toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  }

  function askKey(msg) {
    main.innerHTML = `<form class="key"><div>${esc(msg || "Enter the page key from your link.")}</div>
      <input name="k" type="password" autocomplete="off" placeholder="Key"><button class="primary">Open</button></form>`;
    $("form.key").onsubmit = (e) => { e.preventDefault(); key = e.target.k.value.trim(); store.set("ideas_key", key); load(); };
  }

  async function api(path, opts = {}) {
    const r = await fetch(path, { ...opts, headers: { "content-type": "application/json", "x-ideas-key": key, ...(opts.headers || {}) } });
    const body = await r.json().catch(() => ({}));
    if (r.status === 401) { askKey("That key did not work. Enter it again."); throw new Error("key"); }
    if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
    return body;
  }

  function pickHtml(p) {
    const links = [
      p.film && `<a href="${esc(p.film)}" target="_blank" rel="noopener">film</a>`,
      p.youtube && `<a href="${esc(p.youtube)}" target="_blank" rel="noopener">YouTube</a>`,
      p.session && `<a href="${esc(p.session)}" target="_blank" rel="noopener">run</a>`,
    ].filter(Boolean).join(" · ");
    return `<div class="pick"><span class="state ${esc(p.state)}">${esc(p.state || "picked")}</span>
      · ${esc(p.title || p.angle_title)}${p.publish === false ? " · not publishing" : ""}
      <div>${links}${p.note ? `<div>${esc(p.note)}</div>` : ""}</div>
      <div class="links">picked ${esc(when(p.picked_at))}${p.updated_at && p.updated_at !== p.picked_at ? ` · updated ${esc(when(p.updated_at))}` : ""}</div></div>`;
  }

  function ideaHtml(run, idea) {
    const kind = String(idea.kind || "").toLowerCase();
    const facts = [
      idea.searches && `<span class="fact">searched <b>${esc(idea.searches)}</b></span>`,
      idea.supply && `<span class="fact">YouTube: <b>${esc(idea.supply)}</b></span>`,
      idea.news_date && `<span class="fact">news <b>${esc(idea.news_date)}</b></span>`,
    ].filter(Boolean).join("");
    const links = [...(idea.hn || []).map((h) => `<a href="${esc(h.url)}" target="_blank" rel="noopener">HN ${esc(h.points ?? "")}▲</a>`),
                   ...(idea.sources || []).map((s) => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || "source")}</a>`)].join(" · ");
    const angles = (idea.angles || []).map((a) => `
      <div class="angle"><div class="fmt">${esc(a.format || "explainer")}</div>
        <div class="t">${esc(a.title)}</div>${a.why ? `<div class="why">${esc(a.why)}</div>` : ""}
        <div class="row"><button class="primary" data-make data-run="${esc(run.run_id)}" data-idea="${esc(idea.id)}" data-angle="${esc(a.id)}">Make this</button></div>
      </div>`).join("");
    const picks = (idea.picks || []).map(pickHtml).join("");
    return `<article class="card">
      <div class="top">${kind ? `<span class="kind ${esc(kind)}">${esc(kind)}</span>` : ""}<h3>${esc(idea.topic)}</h3></div>
      ${idea.stakes ? `<div class="stakes">${esc(idea.stakes)}</div>` : ""}
      ${facts ? `<div class="facts">${facts}</div>` : ""}
      ${links ? `<div class="links">${links}</div>` : ""}
      <div class="angles">${angles}</div>
      <details class="own"><summary>Write my own angle</summary>
        <textarea placeholder="The question the film should answer, or the format you want"></textarea>
        <div class="row" style="display:flex;justify-content:flex-end"><button class="primary" data-make data-run="${esc(run.run_id)}" data-idea="${esc(idea.id)}" data-own>Make my angle</button></div>
      </details>
      <div class="opts"><label><input type="checkbox" data-publish checked> Publish on YouTube when done</label></div>
      ${picks}
    </article>`;
  }

  function render(state) {
    const runs = state.runs || [];
    if (!runs.length) { main.innerHTML = `<div class="empty">No ideas yet. The routine adds them here every 12 hours.</div>`; return; }
    $("#sub").textContent = `Last run ${when(runs[0].run_at || runs[0].received_at)}. Pick an angle to make it.`;
    main.innerHTML = runs.map((run) => `<section class="run">
      <h2>${esc(when(run.run_at || run.received_at))} · ${(run.ideas || []).length} ideas</h2>
      ${run.summary ? `<p class="summary">${esc(run.summary)}</p>` : ""}
      ${(run.ideas || []).map((i) => ideaHtml(run, i)).join("")}
    </section>`).join("");
  }

  async function load() {
    if (!key) return askKey();
    try { render(await api("/api/state")); }
    catch (e) { if (e.message !== "key") main.innerHTML = `<div class="err">Could not load: ${esc(e.message)}</div>`; }
  }

  // Two taps: the first arms the button, the second makes the film. Nothing fires by accident.
  main.addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-make]");
    if (!b) return;
    if (!b.classList.contains("confirm")) {
      main.querySelectorAll("button.confirm").forEach((x) => { x.classList.remove("confirm"); x.textContent = x.dataset.own !== undefined ? "Make my angle" : "Make this"; });
      b.classList.add("confirm"); b.textContent = "Tap again to make it";
      clearTimeout(b._t); b._t = setTimeout(() => { b.classList.remove("confirm"); b.textContent = b.dataset.own !== undefined ? "Make my angle" : "Make this"; }, 5000);
      return;
    }
    const card = b.closest(".card");
    const body = { run_id: b.dataset.run, idea_id: b.dataset.idea, publish: $("input[data-publish]", card).checked };
    if (b.dataset.own !== undefined) {
      body.custom_angle = $("textarea", card).value.trim();
      if (!body.custom_angle) { toast("Write the angle first."); return; }
    } else body.angle_id = b.dataset.angle;
    b.disabled = true; b.textContent = "Starting…";
    try { await api("/api/pick", { method: "POST", body: JSON.stringify(body) }); toast("Started. The film shows here as it moves on."); }
    catch (err) { if (err.message !== "key") toast(`Not started: ${err.message}`); }
    load();
  });

  $("#refresh").onclick = load;
  load();
  // Refresh every minute, but never while the owner is typing an angle or has a button armed.
  setInterval(() => {
    const busy = main.querySelector("button.confirm, details[open]");
    if (document.visibilityState === "visible" && key && !busy) load();
  }, 60000);
})();
</script>
</body>
</html>
