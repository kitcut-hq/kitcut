<!--
  Panel: the picture on one side, the words stacked large on a flat panel of
  the film's own ground colour on the other, split by a rule in its accent.
  The quiet side of the frame gets the panel; the picture is slid so what
  matters in it stays in view (_thumb.layout_panel()).

  With `mask` set only the letters are painted, in white.
-->
{{^mask}}<rect x="{{px}}" y="0" width="{{pw}}" height="{{h}}" fill="{{panel}}"/>
<rect x="{{rule_x}}" y="0" width="{{rule_w}}" height="{{h}}" fill="{{rule}}"/>{{/mask}}
{{#lines}}<text x="{{x}}" y="{{y}}" text-anchor="{{anchor}}" font-family="{{family}}"
  font-weight="{{weight}}" font-size="{{size}}" letter-spacing="{{tracking}}"
  fill="{{#mask}}#fff{{/mask}}{{^mask}}{{ink}}{{/mask}}">{{#runs}}<tspan{{^mask}} fill="{{fill}}"{{/mask}}>{{text}}</tspan>{{/runs}}</text>
{{/lines}}
