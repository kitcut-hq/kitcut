<!--
  The page every thumbnail layer is shot in (scripts/_thumb.py paint()).

  One headless shot holds every option's layer and its letter mask, stacked
  top to bottom, each an SVG the size of the thumbnail -- so a whole round of
  options costs one browser start, not eight. The page paints nothing itself:
  html-to-image refuses an opaque shot, and the layer's alpha is what is laid
  over the still.
-->
<meta charset="utf-8">
<style>
{{#fonts}}  @font-face { font-family: "{{family}}"; font-weight: {{weight}}; font-display: block;
               src: url("{{{url}}}") format("truetype"); }
{{/fonts}}
  html, body { margin: 0; background: transparent; }
  svg { display: block; }
</style>
{{#panels}}<svg xmlns="http://www.w3.org/2000/svg" width="{{w}}" height="{{h}}" viewBox="0 0 {{w}} {{h}}">
{{{body}}}
</svg>
{{/panels}}
